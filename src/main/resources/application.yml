server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: cyber-incident-reporting-system

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cyber_incident_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&autoReconnect=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      connection-test-query: "SELECT 1"
      validation-timeout: 3000
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      enabled: true

cirs:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

  storage:
    upload-dir: ${STORAGE_UPLOAD_DIR:./uploads/evidence}
    max-file-size-bytes: 15728640 # 15MB

    allowed-mime-types:
      - application/pdf
      - image/png
      - image/jpeg
      - image/jpg
      - text/plain
      - application/zip
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.tcpdump.pcap
      - application/octet-stream