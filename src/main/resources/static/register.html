<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Citizen Account | Cyber Incident Reporting System</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar" id="main-navbar"></nav>

  <main class="container" style="max-width: 520px; padding: 2rem 1.5rem;">
    <div class="card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <div class="brand-shield" style="margin: 0 auto 0.75rem; width: 48px; height: 48px; font-size: 1.5rem;">📝</div>
        <h1 style="font-size: 1.5rem; font-weight: 700;">Citizen Registration</h1>
        <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem;">Create an account to report cyber incidents and track investigation updates</p>
      </div>

      <div id="register-alert" class="alert alert-danger" style="display: none;"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="fullName">Full Legal or Representative Name</label>
          <input type="text" id="fullName" class="form-control" placeholder="e.g. Jane Doe" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Choose a unique username" minlength="3" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Contact Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="jane.doe@example.com" required>
          <small style="color: var(--text-muted); font-size: 0.75rem;">Used for status notifications & case updates</small>
        </div>

        <div class="form-group">
          <label class="form-label" for="phoneNumber">Contact Phone Number (Optional)</label>
          <input type="tel" id="phoneNumber" class="form-control" placeholder="+1-555-0199">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password (Minimum 8 characters)</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••••••" minlength="8" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••••••" minlength="8" required>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Complete Registration
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-secondary);">
        Already have an account? <a href="/login.html">Sign In</a>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Cyber Incident Reporting System (CIRS)</p>
  </footer>

  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      CIRS.ui.renderNavbar();

      document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertBox = document.getElementById('register-alert');
        const submitBtn = document.getElementById('submit-btn');
        alertBox.style.display = 'none';

        const fullName = document.getElementById('fullName').value.trim();
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const phoneNumber = document.getElementById('phoneNumber').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
          alertBox.innerText = 'Passwords do not match.';
          alertBox.style.display = 'block';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = 'Creating account...';

        try {
          const res = await CIRS.api.post('/auth/register', {
            fullName, username, email, phoneNumber, password
          });

          if (res.success && res.data) {
            CIRS.auth.setSession(res.data.token, res.data);
            window.location.href = '/user/dashboard.html';
          }
        } catch (err) {
          alertBox.innerText = err.message || 'Registration failed. Please check your inputs.';
          alertBox.style.display = 'block';
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerText = 'Complete Registration';
        }
      });
    });
  </script>
</body>
</html>
